<style>

<body>
<three-d-stage name="house-staggered-bars" autorotate></three-d-stage>

<div id="panel">
  <div class="grp">
    <span class="lab">Colour</span>
    <div id="swatches"></div>
    <div class="row pickers">
      <label>Walls<input type="color" id="cWall" value="#e6dfd2"></label>
      <label>Roof<input type="color" id="cRoof" value="#33363a"></label>
      <label>Timber<input type="color" id="cTimber" value="#a97346"></label>
    </div>
  </div>
  <div class="grp">
    <span class="lab">View</span>
    <div class="row">
      <button type="button" id="roofBtn">Hide roof</button>
      <button type="button" id="walkBtn">Free roam</button>
    </div>
  </div>
</div>
<div id="cap"><b>Two bars, one glass spine</b>4 bedrooms in staggered wings, linked by a glazed gallery. Bath opens off the terrace; carport floats out front.</div>
<div id="hint">WASD / arrows to move &middot; mouse to look &middot; Q/E up-down &middot; Shift to sprint &middot; Esc to exit</div>

<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = {
  plaster:  new THREE.MeshStandardMaterial({ name:'plaster',   color:0xe6dfd2, roughness:0.9 }),
  brick:    new THREE.MeshStandardMaterial({ name:'brick',     color:0x3a3a3c, roughness:0.95 }),
  timber:   new THREE.MeshStandardMaterial({ name:'timber',    color:0xa97346, roughness:0.65 }),
  roof:     new THREE.MeshStandardMaterial({ name:'roof_steel',color:0x33363a, roughness:0.45, metalness:0.35 }),
  glass:    new THREE.MeshStandardMaterial({ name:'glass',     color:0x9dc0d2, roughness:0.08, metalness:0.15, transparent:true, opacity:0.42 }),
  concrete: new THREE.MeshStandardMaterial({ name:'concrete',  color:0xcac5bb, roughness:0.95 }),
  steel:    new THREE.MeshStandardMaterial({ name:'steel',     color:0x53575c, roughness:0.4, metalness:0.35 }),
};

const house = new THREE.Group(); house.name = 'staggered_bar_house';
const EAVE = 2.6, HIGH = 3.4, SLOPE = 0.2, TE = 0.24, TI = 0.1;

function box(name, w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name; m.castShadow = true; m.receiveShadow = true; return m;
}
const put = (mesh, x, y, z) => { mesh.position.set(x, y, z); house.add(mesh); return mesh; };

// Wall along plan line (ax,az)->(bx,bz); openings measured from the a end.
function wall(name, ax, az, bx, bz, t, openings = [], h = EAVE, mat = M.plaster) {
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const g = new THREE.Group(); g.name = name;
  g.position.set(ax, 0, az);
  g.rotation.y = -Math.atan2(dz, dx);

  const ops = [...openings].sort((p, q) => p.start - q.start);
  const segs = []; let cur = 0;
  for (const o of ops) {
    if (o.start > cur + 1e-6) segs.push([cur, o.start, 0, h]);
    if (o.sill > 0.001) segs.push([o.start, o.end, 0, o.sill]);
    if (o.top < h - 0.001) segs.push([o.start, o.end, o.top, h]);
    cur = o.end;
  }
  if (cur < L - 1e-6) segs.push([cur, L, 0, h]);
  segs.forEach(([s, e, y0, y1], i) => {
    const m = box(name + '_seg' + i, e - s, y1 - y0, t, mat);
    m.position.set((s + e) / 2, (y0 + y1) / 2, 0); g.add(m);
  });

  ops.forEach((o, i) => {
    const w = o.end - o.start, hh = o.top - o.sill;
    const cx = (o.start + o.end) / 2, cy = (o.sill + o.top) / 2;
    if (o.kind === 'window') {
      const pane = box(name + '_glass' + i, w - 0.1, hh - 0.1, 0.02, M.glass);
      pane.position.set(cx, cy, 0); g.add(pane);
      const f = new THREE.Group(); f.name = name + '_frame' + i, f.userData.trim = 1;
      const j = 0.05, dep = t + 0.02;
      [-1, 1].forEach((sx, k) => {
        const p = box('jamb' + k, j, hh, dep, M.steel);
        p.position.set(cx + sx * (w / 2 - j / 2), cy, 0); f.add(p);
      });
      [-1, 1].forEach((sy, k) => {
        const p = box('rail' + k, w, j, dep, M.steel);
        p.position.set(cx, cy + sy * (hh / 2 - j / 2), 0); f.add(p);
      });
      const n = Math.max(1, Math.round(w / 1.2)) - 1;
      for (let q = 1; q <= n; q++) {
        const p = box('mullion' + q, 0.04, hh - 0.1, t * 0.55, M.steel);
        p.position.set(o.start + (w * q) / (n + 1), cy, 0); f.add(p);
      }
      if (o.sill > 0.2) {
        const s2 = box('sill', w + 0.1, 0.04, t + 0.1, M.concrete);
        s2.position.set(cx, o.sill - 0.02, 0); f.add(s2);
      }
      g.add(f);
    } else if (o.kind === 'door') {
      const leaf = box(name + '_door' + i, w - 0.08, hh - 0.04, 0.05, o.glazed ? M.glass : M.timber);
      leaf.position.set(cx, (hh - 0.04) / 2 + 0.02, 0); g.add(leaf);
      const cas = new THREE.Group(); cas.name = name + '_casing' + i;
      [-1, 1].forEach((sx, k) => {
        const p = box('jamb' + k, 0.05, hh, t + 0.02, M.steel);
        p.position.set(cx + sx * (w / 2 - 0.025), hh / 2, 0); cas.add(p);
      });
      const head = box('head', w, 0.05, t + 0.02, M.steel);
      head.position.set(cx, hh - 0.025, 0); cas.add(head);
      const bar = box('handle', 0.04, 0.9, 0.04, M.steel);
      bar.position.set(cx + w / 2 - 0.18, 1.05, t / 2 + 0.04); cas.add(bar);
      g.add(cas);
    }
  });
  house.add(g);
  return g;
}
const win  = (start, end, sill = 0.95, top = 2.25) => ({ start, end, sill, top, kind: 'window' });
const door = (start, end, top = 2.1, glazed = false) => ({ start, end, sill: 0, top, kind: 'door', glazed });

// Sloped slab (roof / raked ceiling), sloping along x.
function slopedPlane(name, w, d, thick, cx, cy, cz, dir, mat) {
  const ang = Math.atan(SLOPE) * dir;
  const m = box(name, w / Math.cos(Math.atan(SLOPE)), thick, d, mat);
  m.position.set(cx, cy, cz); m.rotation.z = ang;
  house.add(m); return m;
}

// ---- slabs --------------------------------------------------------------
put(box('slab_west_bar', 4.6, 0.24, 9.0, M.concrete), 1.95, -0.08, 4.2);
put(box('slab_east_bar', 4.2, 0.24, 9.0, M.concrete), 7.4, -0.082, 5.8);
put(box('slab_spine', 2.2, 0.24, 9.4, M.concrete), 4.8, -0.084, 5.2);
put(box('terrace', 4.4, 0.1, 2.1, M.concrete), 2.0, 0.01, 9.35);
put(box('courtyard_paving', 4.6, 0.09, 1.5, M.concrete), 7.0, 0.005, 0.75);

// ---- west bar: bedroom 1 (north) + bedroom 3 (south) --------------------
wall('wall_west_outer', 0, 8.4, 0, 0, TE, [
  win(0.75, 3.2, 0.06, 2.35),   // bedroom 3 — glazed doors to veranda
  win(5.0, 7.4),                // bedroom 1 — ribbon window
], EAVE);
wall('wall_west_north', 0, 0, 4.0, 0, TE, [win(2.3, 3.7)], EAVE);
wall('wall_west_south', 4.0, 8.4, 0, 8.4, TE, [win(1.7, 3.1, 0.06, 2.35)], EAVE);
wall('wall_west_inner', 4.0, 0, 4.0, 8.4, TI, [
  door(1.15, 2.05),             // bedroom 1
  door(5.15, 6.05),             // bedroom 3
], HIGH);
wall('wall_bed1_bed3', 0, 4.2, 4.0, 4.2, TI, [], EAVE);

// gable infill above the low walls, under the raked roof
function rake(name, ax, az, bx, bz, t, dir) {
  const L = Math.hypot(bx - ax, bz - az);
  const sh = new THREE.Shape();
  if (dir > 0) { sh.moveTo(0, 0); sh.lineTo(L, 0); sh.lineTo(L, L * SLOPE); }
  else { sh.moveTo(0, 0); sh.lineTo(L, 0); sh.lineTo(0, L * SLOPE); }
  const geo = new THREE.ExtrudeGeometry(sh, { depth: t, bevelEnabled: false });
  geo.translate(0, 0, -t / 2);
  const m = new THREE.Mesh(geo, M.plaster);
  m.name = name; m.castShadow = true; m.receiveShadow = true;
  m.position.set(ax, EAVE, az);
  m.rotation.y = -Math.atan2(bz - az, bx - ax);
  house.add(m); return m;
}
rake('rake_west_north', 0, 0, 4.0, 0, TE, 1);
rake('rake_west_south', 4.0, 8.4, 0, 8.4, TE, -1);

// ---- east bar: bedroom 2, bedroom 4, bath pod ---------------------------
wall('wall_east_outer', 9.2, 1.6, 9.2, 10.0, TE, [
  win(0.9, 3.3),                // bedroom 2
  win(4.9, 6.1),                // bedroom 4
  win(7.1, 7.7, 1.75, 2.35),    // toilet, high light
], EAVE);
wall('wall_east_north', 9.2, 1.6, 5.6, 1.6, TE, [win(0.9, 3.3, 0.06, 2.35)], EAVE);
wall('wall_east_south', 5.6, 10.0, 9.2, 10.0, TE, [
  door(0.5, 1.4),               // shower — own external door
  door(2.2, 3.1),               // toilet — own external door
], EAVE, M.brick);
wall('wall_east_inner', 5.6, 10.0, 5.6, 1.6, TI, [
  door(2.8, 3.7),               // bedroom 4
  door(6.6, 7.5),               // bedroom 2
], HIGH);
wall('wall_bed2_bed4', 5.6, 5.8, 9.2, 5.8, TI, [], EAVE);
wall('wall_bed4_bath', 5.6, 8.2, 9.2, 8.2, TI, [], EAVE);
wall('wall_shower_toilet', 7.4, 8.2, 7.4, 10.0, TI, [], EAVE);
rake('rake_east_north', 9.2, 1.6, 5.6, 1.6, TE, 1);
rake('rake_east_south', 5.6, 10.0, 9.2, 10.0, TE, -1);

// ---- glazed spine (gallery / passage) ----------------------------------
wall('wall_spine_north', 4.0, 0.8, 5.6, 0.8, TE, [win(0.15, 1.45, 0.06, 3.1)], 3.6, M.brick);
wall('wall_spine_south', 5.6, 9.6, 4.0, 9.6, TE, [door(0.35, 1.35, 2.35, true)], 3.6, M.brick);
[[4.0, 1], [5.6, -1]].forEach(([x, s], i) => {
  const c = box('clerestory' + i, 0.08, 0.2, 8.8, M.glass);
  put(c, x, HIGH + 0.1, 5.2);
});

// ---- roofs & raked ceilings --------------------------------------------
slopedPlane('roof_west_bar', 5.0, 9.4, 0.16, 1.95, 3.0, 4.2, 1, M.roof);
slopedPlane('ceiling_west_bar', 4.1, 8.5, 0.07, 2.0, 2.78, 4.2, 1, M.plaster);
slopedPlane('roof_east_bar', 4.6, 9.4, 0.16, 7.45, 3.0, 5.8, -1, M.roof);
slopedPlane('ceiling_east_bar', 3.7, 8.5, 0.07, 7.4, 2.78, 5.8, -1, M.plaster);
put(box('roof_spine_glass', 2.3, 0.06, 9.6, M.glass), 4.8, 3.62, 5.2);
[[0.16, 2.6, 4.2, 9.4, 'west'], [9.16, 2.6, 5.8, 9.4, 'east']].forEach(([x, y, z, d, tag]) => {
  put(box('fascia_' + tag, 0.06, 0.2, d, M.steel), x + (tag === 'west' ? -0.45 : 0.45), y - 0.06, z);
});

// ---- veranda + timber fins (west side) ---------------------------------
put(box('veranda_deck', 2.0, 0.1, 3.8, M.timber), -1.0, 0.03, 6.5);
put(box('veranda_roof', 2.3, 0.1, 4.0, M.roof), -0.95, 2.62, 6.5).rotation.z = -0.05;
for (let i = 0; i < 9; i++) {
  const f = box('fin_' + i, 0.07, 2.5, 0.07, M.timber);
  put(f, -1.95, 1.25, 4.75 + i * 0.44);
}
[4.7, 8.3].forEach((z, i) => put(box('veranda_post_' + i, 0.1, 2.55, 0.1, M.steel), -1.95, 1.27, z));

// ---- courtyard wall (north) --------------------------------------------
wall('garden_wall_north', 9.2, 0.1, 4.6, 0.1, 0.22, [], 1.3, M.brick);
wall('garden_wall_return', 9.2, 0.1, 9.2, 1.6, 0.22, [], 1.3, M.brick);

// ---- carport (front / street side) -------------------------------------
const carport = new THREE.Group(); carport.name = 'carport';
put(box('carport_pad', 3.6, 0.1, 5.4, M.concrete), 7.5, 0.02, 13.2);
[[5.85, 11.0], [9.15, 11.0], [5.85, 15.4], [9.15, 15.4]].forEach(([x, z], i) => {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.6 + (z > 13 ? 0.28 : 0), 24), M.steel);
  p.name = 'carport_post_' + i; p.castShadow = true;
  put(p, x, (2.6 + (z > 13 ? 0.28 : 0)) / 2, z);
});
const canopy = box('carport_canopy', 4.0, 0.1, 5.4, M.roof);
put(canopy, 7.5, 2.78, 13.2).rotation.x = -0.052;
put(box('path_entry', 1.3, 0.08, 1.6, M.concrete), 4.9, 0.015, 10.5);

// ---- centre on origin ---------------------------------------------------
const bb = new THREE.Box3().setFromObject(house);
const c = bb.getCenter(new THREE.Vector3());
house.position.set(-c.x, 0, -c.z);
const root = new THREE.Group(); root.name = 'staggered_bar_house'; root.add(house);
stage.setObject(root);

// ---- colour schemes -----------------------------------------------------
const SCHEMES = [
  { id: 'sand & charcoal', wall: 0xe6dfd2, brick: 0x3a3a3c, timber: 0xa97346, roof: 0x33363a },
  { id: 'chalk & oak',     wall: 0xf4f2ee, brick: 0xc9c2b5, timber: 0xc19a6b, roof: 0x6f7378 },
  { id: 'terracotta',      wall: 0xe0c3a4, brick: 0x7d3d2c, timber: 0x8c5a34, roof: 0x4a3630 },
  { id: 'olive & ash',     wall: 0xd7dbd0, brick: 0x4c5348, timber: 0x8a6a45, roof: 0x2f3833 },
];
const swatches = document.getElementById('swatches');
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
function applyScheme(i) {
  const s = SCHEMES[i];
  M.plaster.color.setHex(s.wall); M.brick.color.setHex(s.brick);
  M.timber.color.setHex(s.timber); M.roof.color.setHex(s.roof);
  [...swatches.children].forEach((b, k) => b.dataset.on = k === i ? '1' : '0');
  syncPickers();
}
SCHEMES.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.title = s.id;
  b.innerHTML = `<i style="background:${hex(s.wall)}"></i><i style="background:${hex(s.roof)}"></i>`;
  b.addEventListener('click', () => applyScheme(i));
  swatches.appendChild(b);
});
const pickers = { cWall: M.plaster, cRoof: M.roof, cTimber: M.timber };
Object.entries(pickers).forEach(([id, mat]) => {
  document.getElementById(id).addEventListener('input', (e) => {
    mat.color.set(e.target.value);
    [...swatches.children].forEach((b) => b.dataset.on = '0');
  });
});
function syncPickers() {
  document.getElementById('cWall').value = '#' + M.plaster.color.getHexString();
  document.getElementById('cRoof').value = '#' + M.roof.color.getHexString();
  document.getElementById('cTimber').value = '#' + M.timber.color.getHexString();
}
applyScheme(0);

// ---- room labels (shown with the roof off) ------------------------------
const labels = new THREE.Group(); labels.name = 'room_labels'; labels.visible = false;
[
  ['Bedroom 1 · 3.6×4.0', 2.0, 2.1], ['Bedroom 3 · 3.6×4.0', 2.0, 6.3],
  ['Bedroom 2 · 3.4×4.0', 7.4, 3.6], ['Bedroom 4 · 3.4×2.3', 7.4, 7.0],
  ['Gallery', 4.8, 5.2], ['Shower', 6.5, 9.1], ['Toilet', 8.3, 9.1],
  ['Veranda', -1.0, 6.5], ['Courtyard', 7.0, 0.8], ['Carport', 7.5, 13.2],
].forEach(([text, x, z]) => {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const g2 = cv.getContext('2d');
  g2.fillStyle = 'rgba(255,255,255,0.92)';
  g2.beginPath(); g2.roundRect(6, 26, 500, 76, 38); g2.fill();
  g2.fillStyle = '#2b2b28';
  g2.font = '600 42px ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif';
  g2.textAlign = 'center'; g2.textBaseline = 'middle';
  g2.fillText(text, 256, 65, 470);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ name: 'label', map: tex, transparent: true, depthTest: false }));
  s.name = 'label_' + text.split(' ·')[0].replace(/\s+/g, '_').toLowerCase();
  s.scale.set(2.1, 0.52, 1); s.position.set(x, 1.95, z);
  labels.add(s);
});
house.add(labels);

// ---- roof toggle --------------------------------------------------------
const roofParts = [];
root.traverse((n) => { if (/^(roof_|ceiling_|fascia_|clerestory)/.test(n.name) || /(_roof|_canopy)$/.test(n.name)) roofParts.push(n); });
const roofBtn = document.getElementById('roofBtn');
let roofOn = true;
roofBtn.addEventListener('click', () => {
  roofOn = !roofOn;
  roofParts.forEach((n) => { n.visible = roofOn; });
  labels.visible = !roofOn;
  roofBtn.textContent = roofOn ? 'Hide roof' : 'Show roof';
  roofBtn.dataset.on = roofOn ? '0' : '1';
});

// ---- free roam (fly) ----------------------------------------------------
const cam = stage._camera, orbit = stage._controls;
const canvas = stage.shadowRoot.querySelector('canvas');
const walkBtn = document.getElementById('walkBtn');
const keys = new Set();
let walking = false, yaw = 0, pitch = 0, saved = null, last = performance.now();

function enterWalk() {
  if (walking) return;
  walking = true;
  document.body.dataset.walk = '1';
  walkBtn.dataset.on = '1'; walkBtn.textContent = 'Exit roam';
  saved = { pos: cam.position.clone(), target: orbit.target.clone() };
  orbit.autoRotate = false; orbit.enabled = false;
  yaw = Math.PI; pitch = -0.05;
  cam.position.set(0, 1.65, 7.0);
  canvas.requestPointerLock?.();
}
function exitWalk() {
  if (!walking) return;
  walking = false;
  document.body.dataset.walk = '0';
  walkBtn.dataset.on = '0'; walkBtn.textContent = 'Free roam';
  if (document.pointerLockElement) document.exitPointerLock();
  cam.position.copy(saved.pos); orbit.target.copy(saved.target);
  cam.lookAt(saved.target); orbit.enabled = true; orbit.update();
}
walkBtn.addEventListener('click', () => (walking ? exitWalk() : enterWalk()));
canvas.addEventListener('click', () => { if (walking && !document.pointerLockElement) canvas.requestPointerLock?.(); });
document.addEventListener('mousemove', (e) => {
  if (!walking || !document.pointerLockElement) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch - e.movementY * 0.0022));
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return exitWalk();
  if (!walking) return;
  keys.add(e.key.toLowerCase());
  if (['w','a','s','d','q','e',' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

const fwd = new THREE.Vector3(), side = new THREE.Vector3();
(function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!walking) return;
  cam.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  const has = (...k) => k.some((x) => keys.has(x));
  const speed = (has('shift') ? 5.2 : 2.1) * dt;
  fwd.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  side.set(Math.cos(yaw), 0, -Math.sin(yaw));
  if (has('w', 'arrowup')) cam.position.addScaledVector(fwd, speed);
  if (has('s', 'arrowdown')) cam.position.addScaledVector(fwd, -speed);
  if (has('d', 'arrowright')) cam.position.addScaledVector(side, speed);
  if (has('a', 'arrowleft')) cam.position.addScaledVector(side, -speed);
  if (has('e')) cam.position.y += speed;
  if (has('q')) cam.position.y -= speed;
  cam.position.y = Math.max(0.35, Math.min(14, cam.position.y));
})(performance.now());
</script>
</body>
</html>
